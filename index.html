<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Animaciones audiovisuales del proyecto ESPEJOS DE NIEBLA.">
  <title>ESPEJOS DE NIEBLA</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="gallery" aria-label="Animaciones audiovisuales">
    <h1 class="visually-hidden">ESPEJOS DE NIEBLA</h1>

    <section class="animation" aria-label="Animación Águila">
      <video class="animation__video" autoplay muted loop playsinline webkit-playsinline
             preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"
             data-video-src="videos/Animación_Águila.mp4">
        Tu navegador no puede reproducir este video.
      </video>
    </section>

    <section class="animation" aria-label="Animación Oso">
      <video class="animation__video" autoplay muted loop playsinline webkit-playsinline
             preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"
             data-video-src="videos/Animación_Oso.mp4">
        Tu navegador no puede reproducir este video.
      </video>
    </section>

    <section class="animation" aria-label="Animación Tigrillo">
      <video class="animation__video" autoplay muted loop playsinline webkit-playsinline
             preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"
             data-video-src="videos/Animación_Tigrillo.mp4">
        Tu navegador no puede reproducir este video.
      </video>
    </section>
  </main>
</body>
</html>
